31.0 246.1 L140.0 242.8 L149.0 239.8 L158.0 237.1 L167.0 234.7 L176.0 232.7 L185.0 230.9 L194.0 229.5 L203.0 228.4 L212.0 227.6 L221.0 227.2 L230.0 227.0 L239.0 227.2 L248.0 227.6 L257.0 228.4 L266.0 229.5 L275.0 230.9 L284.0 232.7 L293.0 234.7 L302.0 237.1 L311.0 239.8 L320.0 242.8" fill="none" stroke="#1D9E75" stroke-width="2"/><text class="ts" x="326.0" y="246.8">AP</text><circle cx="230.0" cy="52.0" r="3" fill="#D85A30"/><circle cx="230.0" cy="227.0" r="3" fill="#D85A30"/><circle cx="230.0" cy="362.0" r="9" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="230.0" y="362.0" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#712B13">2</text></g></svg></div>
<script>
const C=[["畫四組座標軸", ["上面兩張是生產，橫軸是勞動 L。", "下面兩張是成本，橫軸是產量 Q。"]], ["畫 TP（總產量）", ["TP 是投入 L 個勞動生產出來的總產量。", "先越來越陡（報酬遞增），再越來越平（報酬遞減），到最高點之後下降。"]], ["畫 MP（邊際產量）", ["MP 是 TP 的切線斜率，因為 MP = ΔTP ÷ ΔL。", "① TP 的反曲點（斜率最大）= MP 最高。", "③ TP 最高（斜率為 0）= MP 為 0，之後 MP 變成負的。"]], ["畫 AP（平均產量）", ["AP = TP × 1/L，是原點連到 TP 上那一點的斜率（高 ÷ 底）。", "② 從原點畫切線，切點 = AP 最高。", "MP 從上往下穿過 AP 最高點，因為 MP > AP 時 AP 上升，MP < AP 時 AP 下降。"]], ["畫 TFC（總固定成本）", ["TFC 為定值，因為短期的固定投入（例如廠房）不隨 Q 改變，所以是一條水平線。"]], ["畫 TVC（總變動成本）", ["TVC 與 TP 對稱於 y = x（反函數），因為 TVC = w × L，而 L = TP⁻¹(Q)。", "TP 先陡後平，所以 TVC 先平後陡。", "① TVC 的反曲點對應 TP 的反曲點。"]], ["畫 TC（總成本）", ["TFC 與 TVC 疊加成為 TC，因為 TC = TFC + TVC。", "TC 就是 TVC 整條往上平移 TFC，兩線斜率處處相同，反曲點同樣在 ①。"]], ["畫 AFC（平均固定成本）", ["AFC = TFC × 1/Q。", "TFC 固定，所以 AFC × Q 永遠等於定值，形成一路下降的雙曲線，不會碰到軸。"]], ["畫 MC（邊際成本）", ["MC 是 TC、TVC 的切線斜率，因為 MC = ΔTC ÷ ΔQ，而 TFC 不變。", "MC = w ÷ MP（MP 的倒數），所以 ① MP 最高 ↔ MC 最低。"]], ["畫 AVC（平均變動成本）", ["AVC = TVC × 1/Q = w ÷ AP，所以 ② AP 最高 ↔ AVC 最低。", "MC 從下往上穿過 AVC 最低點：邊際低於平均，平均下降；邊際高於平均，平均上升。"]], ["畫 AC（平均總成本）", ["AC = TC × 1/Q = AVC + AFC。", "AC 在 AVC 上方，兩者差距就是 AFC，越來越近但不相交。", "④ MC 穿過 AC 最低點，位置在 ② 右邊，因為 AFC 還在下降，把 AC 再往下拉一段。"]], ["完成：四張圖對照", ["① 生產的轉彎點 ↔ 成本的轉彎點（MP 最高 ↔ MC 最低）。", "② AP 最高 ↔ AVC 最低。", "記法：MP、AP 像山，MC、AVC 像碗，山頂對碗底。"]]];
let i=0;const N=C.length;
function r(){const cur=i+1;document.querySelectorAll('#svgw [data-s]').forEach(e=>{const s=+e.dataset.s;e.style.opacity=s>cur?0:(s===cur||cur===N||s===1)?1:0.45;});
document.getElementById('ttl').textContent=C[i][0];const l=document.getElementById('lst');l.innerHTML='';C[i][1].forEach(t=>{const li=document.createElement('li');li.textContent=t;l.appendChild(li);});
document.getElementById('cnt').textContent=cur+' / '+N;document.getElementById('pv').disabled=i===0;document.getElementById('nx').disabled=i===N-1;}
document.getElementById('pv').onclick=()=>{if(i>0){i--;r();}};
document.getElementById('nx').onclick=()=>{if(i<N-1){i++;r();}};
r();
</script>
